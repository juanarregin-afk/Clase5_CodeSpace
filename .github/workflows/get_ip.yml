name: Get-public-ip

on: 
  push:
    branches:
      - main
      - master

jobs:
    get-ip-job:    
        runs-on: ubuntu-22.04
        steps:
            - name: Public IP
              id: ip
              uses: haythem/public-ip@v1.3
            - name: Muestra IpV4
              run: echo La ip es ${{ steps.ip.outputs.ipv4 }}
            - name: Muestra IpV6
              run: echo La ip es ${{ steps.ip.outputs.ipv6 }}
